name: Build & Release Zro Live APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Optional release tag (e.g. v1.0.1). Leave blank for auto-versioning."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & install required packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"

          find_sdkmanager() {
            if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              return 0
            fi
            local found
            found=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$found" ] && [ -x "$found" ]; then
              echo "$found"
              return 0
            fi
            if command -v sdkmanager >/dev/null 2>&1; then
              command -v sdkmanager
              return 0
            fi
            return 1
          }

          if ! SDKMANAGER="$(find_sdkmanager)"; then
            echo "Preinstalled cmdline-tools sdkmanager not found; downloading official Android command-line tools..."
            TMP_ZIP="/tmp/android-cmdline-tools.zip"
            TMP_EXTRACT="/tmp/android-cmdline-tools-extract"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$TMP_ZIP"
            rm -rf "$TMP_EXTRACT"
            mkdir -p "$TMP_EXTRACT" "$SDK_ROOT/cmdline-tools"
            unzip -q "$TMP_ZIP" -d "$TMP_EXTRACT"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$TMP_EXTRACT/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$TMP_ZIP" "$TMP_EXTRACT"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version

          accept_licenses() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            set -o pipefail
          }

          install_sdk_packages() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "$@"
            local rc="${PIPESTATUS[1]}"
            set -o pipefail
            return "$rc"
          }

          accept_licenses

          # Install only modern Android SDK components matching app/build.gradle.kts (compileSdk 36.1, targetSdk 36)
          install_sdk_packages \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          accept_licenses

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug signing keystore & env file
        run: |
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Determine release version & rename APK
        id: release_meta
        env:
          INPUT_TAG: ${{ inputs.version_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v1.0.${RUN_NUMBER}"
          fi
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Debug APK not found at $APK_SOURCE"
            exit 1
          fi
          APK_TARGET="Zro-Live-${TAG}.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${APK_TARGET}" >> "$GITHUB_OUTPUT"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zro-Live-${{ steps.release_meta.outputs.tag }}
          path: ${{ steps.release_meta.outputs.apk_path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Zro Live ${{ steps.release_meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Zro Live ${{ steps.release_meta.outputs.tag }}
            - Compatible with **Android 7.0 (API 24)** through **Android 16 (API 36)**
            - Download the attached **${{ steps.release_meta.outputs.apk_path }}** file below to install on Android.
          files: |
            ${{ steps.release_meta.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
